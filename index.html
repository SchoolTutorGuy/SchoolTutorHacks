<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade Central - Free Online HTML5 Games</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; }
    header { background-color: #1e293b; padding: 20px; text-align: center; border-bottom: 2px solid #334155; }
    header h1 { color: #38bdf8; font-size: 2rem; }
    .ad-banner { background-color: #1e293b; color: #94a3b8; text-align: center; padding: 15px; margin: 20px auto; max-width: 900px; border: 1px dashed #475569; border-radius: 8px; }
    .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
    .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
    .game-card { background-color: #1e293b; border-radius: 10px; overflow: hidden; border: 1px solid #334155; transition: transform 0.2s; text-decoration: none; color: white; display: flex; flex-direction: column; }
    .game-card:hover { transform: translateY(-5px); border-color: #38bdf8; }
    .game-card img { width: 100%; height: 140px; object-fit: cover; background: #334155; }
    .game-card-body { padding: 15px; }
    .game-card h3 { font-size: 1.1rem; margin-bottom: 5px; color: #f1f5f9; }
    .game-card p { font-size: 0.85rem; color: #94a3b8; }
  </style>
</head>
<body>

  <header>
    <h1>🎮 Arcade Central</h1>
    <p>Play free browser games instantly!</p>
  </header>

  <!-- Top Banner Ad Unit Slot -->
  <div class="ad-banner">
    <p>-- Ad Space (Place Google AdSense code here) --</p>
  </div>

  <div class="container">
    <div class="game-grid">
      
      <!-- Example Game Card 1 -->
      <a href="game1.html" class="game-card">
        <img src="https://via.placeholder.com/220x140?text=Flappy+Bird" alt="Flappy Bird">
        <div class="game-card-body">
          <h3>Flappy Bird</h3>
          <p>Tap to fly through pipes without hitting them!</p>
        </div>
      </a>

      <!-- Example Game Card 2 -->
      <a href="game2.html" class="game-card">
        <img src="https://via.placeholder.com/220x140?text=2048+Game" alt="2048">
        <div class="game-card-body">
          <h3>2048 Arcade</h3>
          <p>Combine matching tiles to reach 2048!</p>
        </div>
      </a>

    </div>
  </div>

</body>
</html>
